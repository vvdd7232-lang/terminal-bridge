name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    # 22.04, а не ubuntu-latest: сервер заявлен как Python 3.8+, а на 24.04
    # готовых сборок 3.8 уже нет.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Версия Python
        run: python -V
      - name: Тесты сервера (unittest)
        run: python -m unittest discover -s tests -v

  js:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Установка зависимостей
        run: npm ci
      - name: Тесты расширения (jsdom)
        run: npm test

  versions:
    name: Согласованность версий и артефактов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: tools/check_versions.py
        run: python tools/check_versions.py
