name: 💡 Идея или вопрос
description: Предложение по функциональности, поддержка нового чата/сайта, вопрос по настройке
labels: ['enhancement']
body:
  - type: textarea
    id: idea
    attributes:
      label: Суть предложения
      description: Что хочется получить и зачем. Если это новый сайт — приложите ссылку и пример `execute`-блока.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Что пробовали / чем обходитесь сейчас
    validations:
      required: false
